<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ecommerce</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0f2f5;
    color: #1a1a2e;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
  }

  .topbar {
    background: #1a1a2e;
    color: #ccc;
    padding: 10px 24px;
    font-size: 12px;
    letter-spacing: .03em;
  }
  .topbar span { color: #fff; font-weight: 500; }

  .page { padding: 20px 24px; }

  .tabs {
    display: flex;
    border-bottom: 1px solid #d0d5e0;
    margin-bottom: 20px;
    background: #fff;
    padding: 0 8px;
    border-radius: 8px 8px 0 0;
  }
  .tab {
    padding: 12px 22px;
    cursor: pointer;
    color: #6b7591;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    font-size: 13px;
    font-weight: 400;
  }
  .tab:hover { color: #1a1a2e; }
  .tab.active { color: #1a1a2e; border-bottom-color: #e6a817; font-weight: 600; }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .filter-label { font-size: 10px; font-weight: 600; color: #6b7591; letter-spacing: .08em; text-transform: uppercase; }
  .filter-select-wrap { position: relative; display: inline-block; }
  .filter-select-wrap select {
    appearance: none;
    background: #fff;
    border: 1px solid #d0d5e0;
    color: #1a1a2e;
    padding: 6px 32px 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    min-width: 80px;
  }
  .filter-select-wrap::after {
    content: '▾';
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #6b7591;
    pointer-events: none;
    font-size: 11px;
  }
  .filter-range-text { font-size: 12px; color: #6b7591; }
  .tip { margin-left: auto; font-size: 11px; color: #9aa3bf; }

  /* Multi-select meses */
  .months-dropdown {
    position: relative;
    display: inline-block;
  }
  .months-btn {
    appearance: none;
    background: #fff;
    border: 1px solid #d0d5e0;
    color: #1a1a2e;
    padding: 6px 32px 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    min-width: 200px;
    text-align: left;
  }
  .months-btn::after {
    content: '▾';
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #6b7591;
    font-size: 11px;
  }
  .months-panel {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: #fff;
    border: 1px solid #d0d5e0;
    border-radius: 6px;
    padding: 8px;
    z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    min-width: 200px;
  }
  .months-panel.open { display: block; }
  .month-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 12px;
    color: #2a2e45;
  }
  .month-opt:hover { background: #f0f2f5; }
  .month-opt input { cursor: pointer; }

  .tbl-outer {
    background: #fff;
    border-radius: 0 0 8px 8px;
    border: 1px solid #d0d5e0;
    border-top: none;
    overflow: hidden;
  }
  .tbl-wrap { overflow-x: auto; max-height: calc(100vh - 220px); overflow-y: auto; }

  table { border-collapse: collapse; width: max-content; min-width: 100%; }

  th, td {
    padding: 7px 14px;
    border-bottom: 1px solid #eceef3;
    white-space: nowrap;
    text-align: right;
  }

  thead th {
    background: #1a1a2e;
    color: #e8eaf0;
    font-weight: 500;
    font-size: 12px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 4;
    border-bottom: none;
    padding: 10px 14px;
  }
  thead th.col-metric {
    text-align: left;
    position: sticky;
    left: 0;
    z-index: 5;
    background: #1a1a2e;
    min-width: 210px;
    width: 210px;
  }

  td.col-metric {
    text-align: left;
    position: sticky;
    left: 0;
    z-index: 2;
    background: #fff;
    color: #2a2e45;
    min-width: 210px;
    width: 210px;
    border-right: 1px solid #eceef3;
  }

  thead th.col-month {
    cursor: pointer;
    user-select: none;
    transition: background .15s;
    min-width: 110px;
  }
  thead th.col-month:hover { background: #2d3352; }

  thead th.col-day {
    display: none;
    background: #252a42;
    font-size: 11px;
    color: #9aa3bf;
    min-width: 100px;
  }
  thead th.col-day.visible { display: table-cell; }
  td.col-day { display: none; background: #fafbff; }
  td.col-day.visible { display: table-cell; }

  thead th.col-acum {
    background: #1a1a2e;
    color: #4a9eff;
    position: sticky;
    right: 0;
    z-index: 4;
    border-left: 2px solid #2d3352;
    font-weight: 600;
  }
  td.col-acum {
    background: #f0f6ff;
    color: #185fa5;
    font-weight: 600;
    position: sticky;
    right: 0;
    z-index: 2;
    border-left: 2px solid #d0dff5;
  }

  tr.data-row:hover td { background: #f7f8fc; }
  tr.data-row:hover td.col-metric { background: #f7f8fc; }
  tr.data-row:hover td.col-acum { background: #e8f0fe; }
  tr.data-row:hover td.col-day { background: #f4f6fb; }
  tr.data-row.hl td { background: #fafbff; }
  tr.data-row.hl td.col-metric { background: #fafbff; font-weight: 500; }

  tr.group-head td {
    background: #1a1a2e;
    padding: 7px 14px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    border-bottom: none;
    color: #e8eaf0;
    cursor: pointer;
    user-select: none;
  }
  tr.group-head:hover td { background: #252a42; }
  tr.group-head td.col-metric {

    color: inherit;
    border-right: none;
    z-index: 3;
  }
  tr.group-head:hover td.col-metric { background: #252a42; }
  tr.group-head td.col-acum {

    color: #4a9eff;
    border-left: 2px solid #2d3352;

  .group-collapsed .group-chevron { transform: rotate(-90deg); }
  .col-chevron { font-size: 8px; margin-right: 4px; display: inline-block; transition: transform .15s; }

  tr.group-spacer td { height: 5px; background: #f0f2f5; border: none; padding: 0; }

// Formato idêntico ao que o Worker vai entregar.
// Uma entrada por dia × canal.
function gerarDadosDemo() {
  const canais = [
    { canal: 'facebook',  investBase: 310, receitaBase: 1200, sesBase: 420 },
    { canal: 'google',    investBase: 200, receitaBase:  720, sesBase: 270 },
    { canal: 'tiktok',    investBase:   0, receitaBase:    0, sesBase:   0 },
    { canal: 'email',     investBase:   0, receitaBase:  115, sesBase:  30 },
    { canal: 'direct',    investBase:   0, receitaBase:   95, sesBase:  33 },
    { canal: 'seo',       investBase:   0, receitaBase:  188, sesBase:  71 },
    { canal: 'sacolinha', investBase:   0, receitaBase:   66, sesBase:  16 },
    { canal: 'instagram', investBase:   0, receitaBase:   30, sesBase:  16 },
    { canal: 'whatsapp',  investBase:   0, receitaBase:   39, sesBase:  13 },
  ];

  const rows = [];
  const hoje = new Date();

  for (let m = 0; m < 12; m++) {
    const diasNoMes = new Date(2025, m + 1, 0).getDate();
    for (let d = 1; d <= diasNoMes; d++) {
      const data = new Date(2025, m, d);
      if (data > hoje) continue;
      const dataStr = `2025-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const fds = data.getDay() === 0 || data.getDay() === 6;

      canais.forEach(c => {
        const ruido = () => 0.75 + Math.random() * 0.5;
        const fator = fds ? 1.3 : 1.0;
        const invest = +(c.investBase * fator * ruido()).toFixed(2);
        const receita = +(c.receitaBase * fator * ruido()).toFixed(2);
        const sessoes = Math.round(c.sesBase * fator * ruido());
        const transacoes = Math.round(receita / 67.5);
        rows.push({
          data: dataStr,
          canal: c.canal,
          receita,
          transacoes,
          sessoes,
          investimento: invest,
        });
      });
    }
  }
  return rows;
}

// ─── FORMATADORES ────────────────────────────────────────────────
const BR = new Intl.NumberFormat('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const BRN = new Intl.NumberFormat('pt-BR');

function fmt(val, type) {
  if (val === null || val === undefined || isNaN(val)) return '—';
  if (type === 'moeda')  return 'R$ ' + BR.format(val);
  if (type === 'pct')    return BR.format(val * 100) + '%';
  if (type === 'roas')   return BR.format(val) + '×';
  if (type === 'num')    return BRN.format(Math.round(val));
  return val;
}

// ─── AGREGAÇÃO ───────────────────────────────────────────────────
// Agrega rawData para um período (array de strings 'YYYY-MM-DD')
// Retorna objeto com somas por canal
function agregaPeriodo(datasArr, canaisGrupo) {
  const canaisSet = canaisGrupo ? new Set(canaisGrupo) : null;
  const totais = {};

  rawData.forEach(r => {
    if (!datasArr.includes(r.data)) return;
    if (canaisSet && !canaisSet.has(r.canal)) return;
    const c = r.canal;
    if (!totais[c]) totais[c] = { receita:0, transacoes:0, sessoes:0, investimento:0, dias:new Set() };
    totais[c].receita      += r.receita;
    totais[c].transacoes   += r.transacoes;
    totais[c].sessoes      += r.sessoes;
    totais[c].investimento += r.investimento;
    totais[c].dias.add(r.data);
  });

  return totais;
}

// Soma totais de múltiplos canais
function somaCanais(totais, canais) {
  const s = { receita:0, transacoes:0, sessoes:0, investimento:0 };
  canais.forEach(c => {
    if (totais[c]) {
      s.receita      += totais[c].receita;
      s.transacoes   += totais[c].transacoes;
      s.sessoes      += totais[c].sessoes;
      s.investimento += totais[c].investimento;
    }
  });
  return s;
}

const CANAIS_MIDIA = ['facebook','google','tiktok'];
const TODOS_CANAIS = ['facebook','google','tiktok','email','direct','seo','sacolinha','instagram','whatsapp'];

// Calcula métricas derivadas dado somas do canal e somas globais
function calcDerived(derived, canal, geral, global) {
  const inv = canal.investimento;
  const rec = canal.receita;
  const ses = canal.sessoes;
  const trx = canal.transacoes;
  const invGlobal = global.investimento;
  const recGlobal = global.receita;
  const sesGlobal = global.sessoes;
  const sesMidia  = global.sesMidia;

  switch(derived) {
    case 'roas':           return inv > 0 ? rec / inv : null;
    case 'txconv':         return ses > 0 ? trx / ses : null;
    case 'ticket':         return trx > 0 ? rec / trx : null;
    case 'cps':            return ses > 0 && inv > 0 ? inv / ses : null;
    case 'pctReceitaGeral': return recGlobal > 0 ? rec / recGlobal : null;
    case 'pctSesMidiaCanal': return sesGlobal > 0 ? ses / sesGlobal : null;
    case 'sesMidia':       return sesMidia;
    case 'cpsMidia':       return sesMidia > 0 && invGlobal > 0 ? invGlobal / sesMidia : null;
    case 'pctSesMidia':    return sesGlobal > 0 ? sesMidia / sesGlobal : null;
    default: return null;
  }
}

// Obtém datas de um mês selecionado
function datasDoMes(monthKey) {
  const mi = MONTH_KEYS.indexOf(monthKey);
  const ano = parseInt(document.getElementById('selAno').value);
  const diasNoMes = new Date(ano, mi + 1, 0).getDate();
  const datas = [];
  for (let d = 1; d <= diasNoMes; d++) {
    datas.push(`${ano}-${String(mi+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return datas;
}

// Obtém todas as datas dos meses selecionados
function todasDatas() {
  let all = [];
  selectedMonths.forEach(m => { all = all.concat(datasDoMes(m)); });
  return all;
}

// ─── CALCULA VALOR PARA UMA CÉLULA ───────────────────────────────
function calcValor(row, group, datas) {
  const totaisCanais = agregaPeriodo(datas, null);
  const globalTotais = somaCanais(totaisCanais, TODOS_CANAIS);
  const midaTotais   = somaCanais(totaisCanais, CANAIS_MIDIA);
  globalTotais.sesMidia = midaTotais.sessoes;
  globalTotais.investimento = midaTotais.investimento;

  let canalSoma;
  if (group.key === 'geral') {
    canalSoma = globalTotais;
  } else {
    canalSoma = somaCanais(totaisCanais, group.canais);
  }

  if (row.calc) return row.calc(canalSoma);
  return calcDerived(row.derived, canalSoma, canalSoma, globalTotais);
}

// ─── MESES DROPDOWN ──────────────────────────────────────────────
function buildMonthsPanel() {
  const ano = parseInt(document.getElementById('selAno').value);
  const hoje = new Date();
  const div = document.getElementById('monthsOpts');
  div.innerHTML = '';

  MONTH_KEYS.forEach((mk, i) => {
    const mesData = new Date(ano, i, 1);
    if (mesData > hoje) return;
    const opt = document.createElement('div');
    opt.className = 'month-opt';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selectedMonths.has(mk);
    cb.addEventListener('change', () => {
      if (cb.checked) selectedMonths.add(mk);
      else selectedMonths.delete(mk);
      updateMonthsBtnLabel();
      updateRangeText();
      renderTable();
    });
    opt.appendChild(cb);
    opt.appendChild(document.createTextNode(ALL_MONTHS[i] + '/' + ano));
    opt.addEventListener('click', e => { if(e.target !== cb) cb.click(); });
    div.appendChild(opt);
  });
}

function updateMonthsBtnLabel() {
  const label = document.getElementById('monthsBtnLabel');
  const n = selectedMonths.size;
  label.textContent = n === 12 ? 'Todos os meses' : n === 0 ? 'Nenhum mês' : `${n} meses selecionados`;

function updateRangeText() {
  const ano = document.getElementById('selAno').value;
  const selecionados = MONTH_KEYS.filter(m => selectedMonths.has(m));
  if (!selecionados.length) { document.getElementById('rangeText').textContent = ''; return; }

  const fim = ALL_MONTHS[MONTH_KEYS.indexOf(selecionados[selecionados.length-1])];

// ─── RENDER TABLE ────────────────────────────────────────────────
function renderTable() {
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  thead.innerHTML = '';
  tbody.innerHTML = '';

  // Meses visíveis (ordenados)
  const mesesVisiveis = MONTH_KEYS.filter(m => selectedMonths.has(m));
  if (!mesesVisiveis.length) return;

  const ano = parseInt(document.getElementById('selAno').value);
  const hoje = new Date();

  // ── CABEÇALHO ──
  const trH = document.createElement('tr');

  const thM = document.createElement('th');
  thM.className = 'col-metric';
  thM.textContent = 'Métrica';
  trH.appendChild(thM);

  mesesVisiveis.forEach(mk => {
    const mi = MONTH_KEYS.indexOf(mk);
    const th = document.createElement('th');
    th.className = 'col-month';
    th.id = 'mh-' + mk;
    th.innerHTML = `<span class="col-chevron">▶</span>${ALL_MONTHS[mi]}/${ano}`;
    th.onclick = () => toggleMes(mk, ano);
    trH.appendChild(th);

    // Colunas de dias
    const diasNoMes = new Date(ano, mi + 1, 0).getDate();
    for (let d = 1; d <= diasNoMes; d++) {
      const dataStr = `${ano}-${String(mi+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dataObj = new Date(ano, mi, d);
      if (dataObj > hoje) continue;
      const thd = document.createElement('th');
      thd.className = 'col-day';
      thd.dataset.month = mk;
      thd.id = `dh-${mk}-${d}`;
      thd.textContent = `${String(d).padStart(2,'0')}/${String(mi+1).padStart(2,'0')}`;
      if (expandedMonths.has(mk)) thd.classList.add('visible');
      trH.appendChild(thd);
    }
  });

  const thA = document.createElement('th');
  thA.className = 'col-acum';
  thA.textContent = 'Acumulado';
  trH.appendChild(thA);
  thead.appendChild(trH);

  // ── CORPO ──
  GROUPS.forEach((group, gi) => {
    // Spacer
    if (gi > 0) {
      const sp = document.createElement('tr');
      sp.className = 'group-spacer';
      const tdSp = document.createElement('td');
      tdSp.colSpan = 999;
      sp.appendChild(tdSp);
      tbody.appendChild(sp);
    }

    // Cabeçalho do grupo
    const ghTr = document.createElement('tr');
    ghTr.className = 'group-head' + (collapsedGroups.has(group.key) ? ' group-collapsed' : '');
    ghTr.id = 'gh-' + group.key;
    ghTr.onclick = () => toggleGroup(group.key);
    const ghTd = document.createElement('td');
    ghTd.colSpan = 999;
    ghTd.className = 'col-metric ' + group.colorCls;
    ghTd.innerHTML = `<span class="group-chevron">▼</span>${group.label}`;
    ghTr.appendChild(ghTd);
    tbody.appendChild(ghTr);

    // Linhas de métricas
    group.rows.forEach((row, ri) => {
      const tr = document.createElement('tr');
      tr.className = 'data-row group-row grp-' + group.key + (row.hl ? ' hl' : '') + (collapsedGroups.has(group.key) ? ' hidden' : '');

      const tdL = document.createElement('td');
      tdL.className = 'col-metric';
      tdL.textContent = row.label;
      tr.appendChild(tdL);

      // Células de mês
      mesesVisiveis.forEach(mk => {
        const mi = MONTH_KEYS.indexOf(mk);
        const datasMes = datasDoMes(mk);
        const val = calcValor(row, group, datasMes);
        const td = document.createElement('td');
        td.textContent = fmt(val, row.fmt);
        if (td.textContent === '—') td.className = 'val-dash';
        tr.appendChild(td);

        // Células de dias
        const diasNoMes = new Date(ano, mi + 1, 0).getDate();
        for (let d = 1; d <= diasNoMes; d++) {
          const dataObj = new Date(ano, mi, d);
          if (dataObj > hoje) continue;
          const dataStr = `${ano}-${String(mi+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const valDia = calcValor(row, group, [dataStr]);
          const tdd = document.createElement('td');
          tdd.className = 'col-day' + (expandedMonths.has(mk) ? ' visible' : '');
          tdd.dataset.month = mk;
          tdd.textContent = fmt(valDia, row.fmt);
          if (tdd.textContent === '—') tdd.classList.add('val-dash');
          tr.appendChild(tdd);
        }
      });

      // Acumulado
      const datasTotal = todasDatas();
      const valAcum = calcValor(row, group, datasTotal);
      const tdA = document.createElement('td');
      tdA.className = 'col-acum';
      tdA.textContent = fmt(valAcum, row.fmt);
      if (tdA.textContent === '—') tdA.classList.add('val-dash');
      tr.appendChild(tdA);

      tbody.appendChild(tr);
    });
  });

  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('mainTable').style.display = '';
}

// ─── TOGGLE MÊS (colunas de dias) ────────────────────────────────
function toggleMes(mk, ano) {
  const expanded = expandedMonths.has(mk);
  if (expanded) expandedMonths.delete(mk);
  else expandedMonths.add(mk);

  const mh = document.getElementById('mh-' + mk);
  if (mh) mh.classList.toggle('month-expanded', !expanded);

  document.querySelectorAll(`[data-month="${mk}"]`).forEach(el => {
    el.classList.toggle('visible', !expanded);
  });
}

// ─── TOGGLE GRUPO (linhas do canal) ──────────────────────────────
function toggleGroup(key) {
  const collapsed = collapsedGroups.has(key);
  if (collapsed) collapsedGroups.delete(key);
  else collapsedGroups.add(key);

  const gh = document.getElementById('gh-' + key);
  if (gh) gh.classList.toggle('group-collapsed', !collapsed);

  document.querySelectorAll('.grp-' + key).forEach(tr => {
    tr.classList.toggle('hidden', !collapsed);
  });
}

function initTabs() {
  const tabs = document.querySelectorAll('.tab');
  const aba1Wrap = document.querySelector('.tbl-outer');
  const filterBar = document.querySelector('.filter-bar');

  function hideAll() {
    aba1Wrap.style.display = 'none';
    filterBar.style.display = 'none';
    ['aba-visao-geral','aba-utm','aba-txconv','aba-abc','aba-regioes','aba-simulacao','aba-metarealizado'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }

  tabs.forEach((tab, i) => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      hideAll();
      if (i === 0) {
        aba1Wrap.style.display = '';
        filterBar.style.display = '';
      } else if (i === 1) {
        const vg = document.getElementById('aba-visao-geral');
        if (vg) {
          vg.style.display = 'block';
          if (window.renderAbaVisaoGeral) window.renderAbaVisaoGeral();
        }
      } else if (i === 2) {
        const utm = document.getElementById('aba-utm');
        if (utm) {
          utm.style.display = 'block';
          if (window.renderUtmAba) window.renderUtmAba();
        }
      } else if (i === 3) {
        var tc = document.getElementById('aba-txconv');
        if (tc) { tc.style.display = 'block'; if (window.renderTxConv) window.renderTxConv(); }
      } else if (i === 4) {
        var abc = document.getElementById('aba-abc');
        if (abc) { abc.style.display = 'block'; if (window.renderABC) window.renderABC(); }
      } else if (i === 5) {
        var reg = document.getElementById('aba-regioes');
        if (reg) { reg.style.display = 'block'; if (window.renderRegioes) window.renderRegioes(); }
      } else if (i === 6) {
        var sim = document.getElementById('aba-simulacao');
        if (sim) { sim.style.display = 'block'; if (window.renderSimulacao) window.renderSimulacao(); }
      } else if (i === 7) {
        var mr = document.getElementById('aba-metarealizado');
        if (mr) { mr.style.display = 'block'; if (window.renderMetaRealizado) window.renderMetaRealizado(); }
      }
    });
  });
}

window.setPeriodVG = function(days, btn) {
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cr = document.getElementById('vgCustomRange');
  if (cr) cr.style.display = days === 0 ? 'flex' : 'none';
  if (days > 0) {
    const fim = new Date();
    const ini = new Date();
    ini.setDate(ini.getDate() - days);
    const fmt = d => d.toISOString().slice(0,10);
    const lbl = document.getElementById('vgRangeLabel');
    if (lbl) lbl.textContent = fmt(ini) + ' → ' + fmt(fim);
  }
};

window.updateVGCompare = function() {
  const v = document.getElementById('vgCompare').value;
  const ccr = document.getElementById('vgCompareCustom');
  if (ccr) ccr.style.display = v === 'custom' ? 'flex' : 'none';
};

function d(val, delta, up) {
  if (!delta || delta === '-') return '';
  return '<span class="' + (up ? 'dUp' : 'dDn') + '">' + (up ? '▲' : '▼') + ' ' + delta + '</span>';
}

function buildTable(headId, bodyId, headers, rows, clickFn, selVal) {
  var th = document.getElementById(headId);
  var tb = document.getElementById(bodyId);
  if (!th || !tb) return;
  th.innerHTML = headers.map(function(h) {
    return '<th class="utm-th" style="text-align:' + (h.r ? 'right' : 'left') + ';">' + h.l + '</th>';
  }).join('');
  if (!rows || !rows.length) {
    tb.innerHTML = '<tr><td colspan="' + headers.length + '" style="padding:14px;text-align:center;color:#9aa3bf;font-size:12px;">Selecione um item acima para ver detalhes</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(function(r) {
    var sel = (selVal === r.val) ? ' selected' : '';
    var clk = clickFn ? ' onclick="' + clickFn + '(\'' + r.val.replace(/'/g,"\\'") + '\')"' : '';
    var cells = headers.map(function(h) {
      var v = r[h.k] !== undefined ? r[h.k] : '—';
      var delta = h.dk ? d(v, r[h.dk], r[h.uk]) : '';
      return '<td class="utm-td" style="text-align:' + (h.r ? 'right' : 'left') + ';">' + v + delta + '</td>';
    }).join('');
    return '<tr class="utm-row' + sel + '"' + clk + '>' + cells + '</tr>';
  }).join('');
}

function getGrp(src) {
  if (!src) return null;
  if (src === 'facebook') return 'facebook';
  if (src === 'google')   return 'google';
  return 'organico';
}

window.renderUtmAba = function() {
  var el = document.getElementById('aba-utm');
  if (!el.innerHTML.trim()) {
    el.innerHTML = [
      buildPeriodCard(),
      buildBreadcrumb(),
      buildQuadro('q1','Origem da sessão','utm_source','#7ed348'),
      buildQuadro('q2','Campanhas','utm_campaign','#4a9eff'),
      buildQuadro('q3','Meio','utm_medium','#f5c518'),
      buildQuadro('q4','Conteúdo / Criativo','utm_content','#c870c8'),
      buildQuadro('q5','Termo de pesquisa','utm_term','#25D366')
    ].join('');
    document.querySelector('.utm-period-btn').classList.add('active');
    setUtmPeriod(7, document.querySelector('.utm-period-btn'));
  }
  var grp = getGrp(utmFiltros.source);

  // Q1 — sempre mostra todas as origens
  buildTable('th-q1','tb-q1', COLS_SRC, UTM_DATA.source, 'selSource', utmFiltros.source);

  // Q2 — filtra por source
  var campRows = utmFiltros.source
    ? (UTM_DATA.campaign[grp] || [])
    : Object.values(UTM_DATA.campaign).reduce(function(a,b){return a.concat(b);},[]);
  buildTable('th-q2','tb-q2', mkCols('Campanha'), campRows, 'selCampaign', utmFiltros.campaign);

  // Q3 — filtra por source
  var medRows = grp && UTM_DATA.medium[grp] ? UTM_DATA.medium[grp] : [];
  buildTable('th-q3','tb-q3', mkCols('Meio'), medRows, 'selMedium', utmFiltros.medium);

  // Q4 — filtra por campaign selecionada
  var contRows = utmFiltros.campaign && UTM_DATA.content[utmFiltros.campaign]
    ? UTM_DATA.content[utmFiltros.campaign] : [];
  buildTable('th-q4','tb-q4', mkCols('Conteúdo / Criativo'), contRows, 'selContent', utmFiltros.content);

  // Q5 — filtra por campaign selecionada
  var termRows = utmFiltros.campaign && UTM_DATA.term[utmFiltros.campaign]
    ? UTM_DATA.term[utmFiltros.campaign] : [];
  buildTable('th-q5','tb-q5', mkCols('Termo de pesquisa'), termRows, 'selTerm', utmFiltros.term);

  refreshBreadcrumb();
};

function mkCols(lbl) {
  return [{l:lbl,k:'val',r:0}].concat(COLS_REST.slice(1));

function buildQuadro(qid, label, utmKey, color) {

    '<span style="font-size:10px;color:#6b7591;font-family:monospace;">' + utmKey + '</span></div>' +
    '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">' +
    '<thead><tr id="th-' + qid + '"></tr></thead>' +
    '<tbody id="tb-' + qid + '"></tbody>' +
    '</table></div></div>';
}

function buildBreadcrumb() {
  return '<div id="utm-bc" style="display:none;background:#f0f6ff;border:1px solid #d0dff5;border-radius:8px;padding:10px 16px;margin-bottom:12px;align-items:center;gap:8px;font-size:12px;color:#185fa5;">' +
    '<span id="utm-bc-text"></span>' +
    '<button onclick="resetUtm()" style="margin-left:auto;background:none;border:1px solid #b5d4f4;color:#185fa5;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;">Limpar filtros</button></div>';
}

function refreshBreadcrumb() {
  var bc = document.getElementById('utm-bc');
  var bt = document.getElementById('utm-bc-text');
  if (!bc) return;
  var parts = [];
  if (utmFiltros.source)   parts.push('Source: ' + utmFiltros.source);
  if (utmFiltros.campaign) parts.push('Campaign: ' + utmFiltros.campaign);
  if (utmFiltros.medium)   parts.push('Medium: ' + utmFiltros.medium);
  if (utmFiltros.content)  parts.push('Content: ' + utmFiltros.content);
  if (utmFiltros.term)     parts.push('Term: ' + utmFiltros.term);
  if (parts.length) { bc.style.display = 'flex'; bt.textContent = parts.join(' › '); }
  else { bc.style.display = 'none'; }
}

window.selSource = function(val) {
  utmFiltros = {source: utmFiltros.source === val ? null : val, campaign:null, medium:null, content:null};
  window.renderUtmAba();
};
window.selCampaign = function(val) {
  utmFiltros.campaign = utmFiltros.campaign === val ? null : val;
  utmFiltros.medium = null; utmFiltros.content = null;
  window.renderUtmAba();
};
window.selMedium = function(val) {
  utmFiltros.medium = utmFiltros.medium === val ? null : val;
  utmFiltros.content = null;
  window.renderUtmAba();
};
window.selContent = function(val) {
  utmFiltros.content = utmFiltros.content === val ? null : val;
  utmFiltros.term = null;
  window.renderUtmAba();
};
window.selTerm = function(val) {
  utmFiltros.term = utmFiltros.term === val ? null : val;
  window.renderUtmAba();
};
window.resetUtm = function() {
  utmFiltros = {source:null,campaign:null,medium:null,content:null,term:null};
  window.renderUtmAba();
};

window.setUtmPeriod = function(days, btn) {
  document.querySelectorAll('.utm-period-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  var cr = document.getElementById('utmCR');
  if (cr) cr.style.display = days === 0 ? 'flex' : 'none';
  if (days > 0) {
    var fim = new Date(), ini = new Date();
    ini.setDate(ini.getDate() - days);
    var fmt = function(dt){ return dt.toISOString().slice(0,10); };
    var lbl = document.getElementById('utmRL');
    if (lbl) lbl.textContent = fmt(ini) + ' \u2192 ' + fmt(fim);
  }
};

window.utmCmpChg = function(sel) {
  var cc = document.getElementById('utmCC');
  if (cc) cc.style.display = sel.value === 'custom' ? 'flex' : 'none';
};

// ─── AGRUPAMENTO POR PRODUTO BASE ─────────────────────────────────
// Replica a lógica do BigQuery: TRIM(REGEXP_REPLACE(item_name, r'\s*\([^)]*\)\s*$', ''))
// Remove qualquer coisa entre parênteses no final do nome e soma os dados das variações.
function nomeBaseProduto(nome) {
  return nome.replace(/\s*\([^)]*\)\s*$/, '').trim();
}

function agruparProdutos(brutos) {
  var grupos = {};
  var ordem = [];

  brutos.forEach(function(p) {
    var base = nomeBaseProduto(p.nome);
    if (!grupos[base]) {
      grupos[base] = { nome: base, cat: p.cat, dados: {} };
      ordem.push(base);
    }
    MESES_KEYS.forEach(function(m) {
      if (!p.dados[m]) return;
      var d = p.dados[m]; // [sessoes, itens, receita, txConv(ignorado-recalc), precoMedio(ignorado-recalc)]
      if (!grupos[base].dados[m]) {
        grupos[base].dados[m] = [0, 0, 0, 0, 0];
      }
      grupos[base].dados[m][0] += d[0]; // sessões somadas
      grupos[base].dados[m][1] += d[1]; // itens vendidos somados
      grupos[base].dados[m][2] += d[2]; // receita somada
    });
  });

  // Recalcular taxa de conversão e preço médio sobre os totais agrupados (não soma de %)
  ordem.forEach(function(base) {
    var g = grupos[base];
    MESES_KEYS.forEach(function(m) {
      if (!g.dados[m]) return;
      var sessoes = g.dados[m][0];
      var itens = g.dados[m][1];
      var receita = g.dados[m][2];
      g.dados[m][3] = sessoes > 0 ? (itens / sessoes * 100) : 0;
      g.dados[m][4] = itens > 0 ? 'R$' + (receita / itens).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) : 'R$0,00';
    });
  });

  return ordem.map(function(base) { return grupos[base]; });
}

function renderTxTable() {
  var meses = MESES_KEYS.filter(function(m){ return txSelectedMonths.has(m); });
  var todosProdutos = PRODUTOS.filter(function(p){
    return !txSearchTerm || p.nome.toLowerCase().indexOf(txSearchTerm.toLowerCase()) >= 0;
  });

  // Paginação
  var totalProd = todosProdutos.length;
  var totalPages = Math.max(1, Math.ceil(totalProd / TX_PAGE_SIZE));
  if (txCurrentPage > totalPages) txCurrentPage = totalPages;
  var inicio = (txCurrentPage - 1) * TX_PAGE_SIZE;
  var produtos = todosProdutos.slice(inicio, inicio + TX_PAGE_SIZE);

  // Atualizar info de paginação
  var info = document.getElementById('txPagInfo');
  var num  = document.getElementById('txPagNum');
  var prev = document.getElementById('txBtnPrev');
  var next = document.getElementById('txBtnNext');
  if (info) info.textContent = 'Mostrando ' + (inicio+1) + '–' + Math.min(inicio+TX_PAGE_SIZE, totalProd) + ' de ' + totalProd + ' produtos';
  if (num)  num.textContent  = 'Página ' + txCurrentPage + ' de ' + totalPages;
  if (prev) prev.disabled = txCurrentPage === 1;
  if (next) next.disabled = txCurrentPage === totalPages;
  if (prev) prev.style.opacity = txCurrentPage === 1 ? '0.4' : '1';
  if (next) next.style.opacity = txCurrentPage === totalPages ? '0.4' : '1';

  var thead = document.getElementById('txThead');
  var tbody = document.getElementById('txTbody');
  if (!thead || !tbody) return;

  // Cabeçalho
  var thCols = meses.map(function(m){
    return '<th class="tc-th" colspan="1">Total - ' + MESES_LABEL[m] + '</th>';
  }).join('');
  thead.innerHTML = '<tr><th class="tc-th" style="text-align:left;min-width:160px;position:sticky;left:0;z-index:5;border-right:1px solid #2d3352;">Métrica</th>' + thCols + '<th class="tc-th" style="background:#0c447c;position:sticky;right:0;z-index:4;border-left:2px solid #2d3352;">Acumulado</th></tr>';

  // Linhas por produto
  var METRICAS = ['Sessões','Itens vendidos','Receita','Taxa de conversão','Preço médio'];
  var rows = '';

  produtos.forEach(function(p) {
    var totalSes   = meses.reduce(function(s,m){ return s+(p.dados[m]?p.dados[m][0]:0);},0);
    var totalItens = meses.reduce(function(s,m){ return s+(p.dados[m]?p.dados[m][1]:0);},0);
    var totalRec   = meses.reduce(function(s,m){ return s+(p.dados[m]?p.dados[m][2]:0);},0);

    // Linha do nome do produto na coluna esquerda
    rows += '<tr style="border-top:2px solid #d0d5e0;">' +
      '<td style="text-align:left;padding:8px 14px;background:#1a1a2e;color:#7ed348;font-size:11px;font-weight:700;letter-spacing:.04em;position:sticky;left:0;z-index:2;border-right:1px solid #2d3352;">' + p.nome + '</td>' +
      meses.map(function(){ return '<td style="background:#1a1a2e;border-bottom:1px solid #2d3352;"></td>'; }).join('') +
      '<td style="background:#0c447c;border-left:2px solid #2d3352;"></td>' +
      '</tr>';

    // Linhas de métricas
    METRICAS.forEach(function(metrica, mi) {
      var cells = meses.map(function(m) {
        var d = p.dados[m];
        if (!d) return '<td class="tc-td">—</td>';
        var val = d[mi];
        var fmt;
        if (mi === 0) fmt = val.toLocaleString('pt-BR');
        else if (mi === 1) fmt = val.toLocaleString('pt-BR');
        else if (mi === 2) fmt = 'R$ ' + val.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
        else if (mi === 3) fmt = val.toFixed(2) + '%';
        else fmt = val;
        return '<td class="tc-td">' + fmt + '</td>';
      }).join('');

      var acumFmt;
      if (mi === 0) acumFmt = totalSes.toLocaleString('pt-BR');
      else if (mi === 1) acumFmt = totalItens.toLocaleString('pt-BR');
      else if (mi === 2) acumFmt = 'R$ ' + totalRec.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
      else if (mi === 3) acumFmt = totalSes > 0 ? (totalItens/totalSes*100).toFixed(2)+'%' : '—';
      else acumFmt = totalItens > 0 ? 'R$ ' + (totalRec/totalItens).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';

      var borderBot = mi === 4 ? 'border-bottom:2px solid #d0d5e0;' : '';
      rows += '<tr style="' + borderBot + '">' +
        '<td class="tc-td-metric" style="position:sticky;left:0;z-index:2;border-right:1px solid #eceef3;' + borderBot + '">' + metrica + '</td>' +
        cells +
        '<td class="tc-td" style="background:#f0f6ff;color:#185fa5;font-weight:500;position:sticky;right:0;z-index:2;border-left:2px solid #d0dff5;' + borderBot + '">' + acumFmt + '</td></tr>';
    });
  });

  tbody.innerHTML = rows || '<tr><td colspan="' + (meses.length+2) + '" style="padding:20px;text-align:center;color:#9aa3bf;">Nenhum produto encontrado</td></tr>';
}

function renderABCTable() {
  var meses = MESES_KEYS.filter(function(m){ return abcSelectedMonths.has(m); });

  // Calcular receita total por produto no período
  var todosProds = PRODUTOS.map(function(p) {
    var receita = meses.reduce(function(s,m){ return s + (p.dados[m] ? p.dados[m][2] : 0); }, 0);
    var sessoes = meses.reduce(function(s,m){ return s + (p.dados[m] ? p.dados[m][0] : 0); }, 0);
    var itens   = meses.reduce(function(s,m){ return s + (p.dados[m] ? p.dados[m][1] : 0); }, 0);
    var txConv  = sessoes > 0 ? (itens/sessoes*100) : 0;
    return {nome:p.nome, cat:p.cat, receita:receita, sessoes:sessoes, itens:itens, txConv:txConv};
  });

  // Ordenar por receita decrescente
  todosProds.sort(function(a,b){ return b.receita - a.receita; });

  // Calcular % acumulada sobre TODOS os produtos
  var receitaTotal = todosProds.reduce(function(s,p){ return s + p.receita; }, 0);
  var acumGlobal = 0;

  // Corte de sessões — percentil dinâmico
  var sessoesOrdenadas = todosProds.map(function(p){ return p.sessoes; }).sort(function(a,b){ return a-b; });
  var idxPerc = Math.floor(sessoesOrdenadas.length * abcPercCorte / 100);
  var cortesSessoes = sessoesOrdenadas[Math.min(idxPerc, sessoesOrdenadas.length-1)] || 0;

  // TX conversão média do e-commerce — calculada automaticamente
  var totalSesEcom  = todosProds.reduce(function(s,p){ return s + p.sessoes; }, 0);
  var totalItensEcom = todosProds.reduce(function(s,p){ return s + p.itens; }, 0);
  var txMediaEcom = totalSesEcom > 0 ? (totalItensEcom / totalSesEcom * 100) : 0;

  // Corte de taxa de conversão — fixo em 90% da média
  var corteTx = txMediaEcom * 0.90;

  // Atualizar displays
  var dispTx = document.getElementById('abcTxMediaDisplay');
  if (dispTx) dispTx.textContent = txMediaEcom.toFixed(2) + '%';

  var dispSes = document.getElementById('abcSessoesDisplay');
  if (dispSes) dispSes.textContent = totalSesEcom.toLocaleString('pt-BR');

  var dispCorteTx = document.getElementById('abcCorteTxDisplay');
  if (dispCorteTx) dispCorteTx.textContent = corteTx.toFixed(2) + '%';

  todosProds = todosProds.map(function(p) {
    acumGlobal += p.receita;
    var pct = receitaTotal > 0 ? (p.receita/receitaTotal*100) : 0;
    var pctAcum = receitaTotal > 0 ? (acumGlobal/receitaTotal*100) : 0;
    var curva = pctAcum <= 80 ? 'A' : pctAcum <= 95 ? 'B' : 'C';

    // Quadrante
    var muitasSessoes = p.sessoes >= cortesSessoes;
    var altaConv = p.txConv >= corteTx;
    var quadrante;
    if (muitasSessoes && altaConv)   quadrante = 'A';
    else if (!muitasSessoes && altaConv)  quadrante = 'B';
    else if (muitasSessoes && !altaConv)  quadrante = 'C';
    else quadrante = 'D';

    return {nome:p.nome, cat:p.cat, receita:p.receita, sessoes:p.sessoes, itens:p.itens, txConv:p.txConv, pct:pct, pctAcum:pctAcum, curva:curva, quadrante:quadrante};
  });

  // Paginação
  var totalProd = todosProds.length;
  var totalPages = Math.max(1, Math.ceil(totalProd / ABC_PAGE_SIZE));
  if (abcCurrentPage > totalPages) abcCurrentPage = totalPages;
  var inicio = (abcCurrentPage - 1) * ABC_PAGE_SIZE;
  var prods = todosProds.slice(inicio, inicio + ABC_PAGE_SIZE);

  // Atualizar controles
  var info = document.getElementById('abcPagInfo');
  var num  = document.getElementById('abcPagNum');
  var prev = document.getElementById('abcBtnPrev');
  var next = document.getElementById('abcBtnNext');
  if (info) info.textContent = 'Mostrando ' + (inicio+1) + '–' + Math.min(inicio+ABC_PAGE_SIZE, totalProd) + ' de ' + totalProd + ' produtos';
  if (num)  num.textContent  = 'Página ' + abcCurrentPage + ' de ' + totalPages;
  if (prev) { prev.disabled = abcCurrentPage === 1; prev.style.opacity = abcCurrentPage === 1 ? '0.4' : '1'; }
  if (next) { next.disabled = abcCurrentPage === totalPages; next.style.opacity = abcCurrentPage === totalPages ? '0.4' : '1'; }

  var tbody = document.getElementById('abcTbody');
  if (!tbody) return;

  tbody.innerHTML = prods.map(function(p, i) {
    var badge = p.curva === 'A' ? 'badge-a' : p.curva === 'B' ? 'badge-b' : 'badge-c';
    var bgRow = p.curva === 'A' ? '#f6fff6' : p.curva === 'B' ? '#fffdf0' : '#fff8f8';
    return '<tr style="background:' + bgRow + ';">' +
      '<td class="tc-td" style="color:#9aa3bf;text-align:left;">' + (inicio+i+1) + '</td>' +
      '<td class="tc-td" style="text-align:left;font-weight:500;color:#1a1a2e;">' + p.nome + '</td>' +
      '<td class="tc-td" style="text-align:left;color:#6b7591;">' + p.cat + '</td>' +
      '<td class="tc-td" style="font-weight:500;">R$ ' + p.receita.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '</td>' +
      '<td class="tc-td">' + p.pct.toFixed(1) + '%</td>' +
      '<td class="tc-td">' + p.pctAcum.toFixed(1) + '%</td>' +
      '<td class="tc-td">' + p.txConv.toFixed(2) + '%</td>' +
      '<td class="tc-td">' + p.sessoes.toLocaleString('pt-BR') + '</td>' +
      '<td class="tc-td">' + p.itens.toLocaleString('pt-BR') + '</td>' +
      '<td class="tc-td" style="background:#f3f0fb;">' + '<span class="' + badge + '">' + p.curva + '</span></td>' +
      '<td class="tc-td" style="background:#f3f0fb;"><span style="font-weight:600;padding:2px 8px;border-radius:4px;font-size:11px;background:' +
        (p.quadrante==='A'?'#e8f5e9;color:#155724':p.quadrante==='B'?'#e3f2fd;color:#0d47a1':p.quadrante==='C'?'#fff8e1;color:#856404':'#fce4ec;color:#880e4f') +
        ';">Q-' + p.quadrante + '</span></td>' +
    '</tr>';
  }).join('');
}

window.abcToggleMes = function(mk, cb) {
  if (cb.checked) abcSelectedMonths.add(mk);
  else abcSelectedMonths.delete(mk);
  var n = abcSelectedMonths.size;
  var lbl = document.getElementById('abcMesesLabel');
  if (lbl) lbl.textContent = n === 12 ? 'Todos os meses' : n === 0 ? 'Nenhum' : n + ' meses selecionados';
  abcCurrentPage = 1;
  renderABCTable();
};
window.abcPrevPage = function() {
  if (abcCurrentPage > 1) { abcCurrentPage--; renderABCTable(); }
};
window.abcNextPage = function() {
  abcCurrentPage++;
  renderABCTable();
};

window.abcTogglePanel = function(e) {
  e.stopPropagation();
  var p = document.getElementById('abcMesesPanel');
  if (p) p.style.display = p.style.display === 'block' ? 'none' : 'block';
};

})();
</script>

function colorEstado(receita) {
  var pct = receita / receitaMax;
  if (pct > 0.8) return '#0c447c';
  if (pct > 0.5) return '#185fa5';
  if (pct > 0.3) return '#378add';
  if (pct > 0.15) return '#85b7eb';
  if (pct > 0.05) return '#b5d4f4';
  return '#e6f1fb';
}

function fmt(v, type) {
  if (v === null || v === undefined) return '—';
  if (type === 'moeda') return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (type === 'pct')   return v.toFixed(2) + '%';
  if (type === 'x')     return v.toFixed(1) + 'x';
  if (type === 'num')   return v.toLocaleString('pt-BR');
  return v;
}

function delta(atual, ant) {
  if (!ant) return '';
  var pct = ((atual - ant) / ant * 100);
  var up = pct >= 0;
  return '<span style="font-size:10px;margin-left:3px;color:' + (up ? '#0ca30c' : '#d03b3b') + ';">' + (up ? '▲' : '▼') + ' ' + Math.abs(pct).toFixed(1) + '%</span>';
}

function calcRegiao(nomeRegiao) {
  var reg = REGIOES[nomeRegiao];
  var ests = ESTADOS_DATA.filter(function(e){ return reg.estados.indexOf(e.uf) >= 0; });
  var receita = ests.reduce(function(s,e){ return s+e.receita; }, 0);
  var recAnt  = ests.reduce(function(s,e){ return s+e.recAnt; }, 0);
  var sessoes = ests.reduce(function(s,e){ return s+e.sessoes; }, 0);
  var sesAnt  = ests.reduce(function(s,e){ return s+e.sesAnt; }, 0);
  var pedidos = ests.reduce(function(s,e){ return s+e.pedidos; }, 0);
  var pedAnt  = ests.reduce(function(s,e){ return s+Math.round(e.pedidos*(e.recAnt/(e.receita||1))); }, 0);
  var txConv  = sessoes > 0 ? pedidos/sessoes*100 : 0;
  var txAnt2  = sesAnt  > 0 ? pedAnt/sesAnt*100  : 0;
  return {receita:receita, recAnt:recAnt, txConv:txConv, txAnt:txAnt2, sessoes:sessoes, pedidos:pedidos, pedAnt:pedAnt};
}

function buildMapaSVG() {
  var svgPaths = MAPA_PATHS.map(function(p) {
    var est = ESTADOS_DATA.find(function(e){ return e.uf === p.uf; });
    var cor = est ? colorEstado(est.receita) : '#e6f1fb';
    return '<path class="estado-path" data-uf="' + p.uf + '" d="' + p.d + '" fill="' + cor + '" stroke="#fff" stroke-width="0.5"/>' +
           '<text style="font-size:7px;fill:#1a1a2e;pointer-events:none;font-weight:500;" x="' + p.cx + '" y="' + p.cy + '" text-anchor="middle">' + p.uf + '</text>';
  }).join('');

  return '<div><svg viewBox="50 30 720 640" width="100%" style="max-height:520px;display:block;">' + svgPaths + '</svg></div>';
}

function initMapaEvents() {
  var tooltip = document.getElementById('reg-tooltip');
  var wrap = document.getElementById('regMapaWrap');
  if (!tooltip || !wrap) return;

  document.querySelectorAll('.estado-path').forEach(function(path) {
    path.addEventListener('mousemove', function(e) {
      var uf = path.dataset.uf;
      var est = ESTADOS_DATA.find(function(x){ return x.uf === uf; });
      if (!est) return;
      var rect = wrap.getBoundingClientRect();
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
      tooltip.style.top  = (e.clientY - rect.top  - 10) + 'px';
      tooltip.innerHTML = '<strong style="color:#7ed348;">' + est.nome + '</strong><br>' +
        'Receita: ' + fmt(est.receita,'moeda') + delta(est.receita, est.recAnt) + '<br>' +
        'Sessões: ' + fmt(est.sessoes,'num') + delta(est.sessoes, est.sesAnt) + '<br>' +
        'TX conv.: ' + fmt(est.txConv,'pct') + delta(est.txConv, est.txAnt) + '<br>' +
        'ROAS: ' + fmt(est.roas,'x') + delta(est.roas, est.roasAnt);
    });
    path.addEventListener('mouseleave', function() {
      tooltip.style.display = 'none';
    });
  });
}

function renderRegCidades() {
  var sorted = CIDADES_DATA.slice()
    .filter(function(c){ return !regEstadoSelecionado || c.estado === regEstadoSelecionado; })
    .sort(function(a,b){ return b.receita - a.receita; });
  var total = sorted.length;
  var totalPages = Math.max(1, Math.ceil(total / REG_CIDADE_SIZE));
  if (regCidadePage > totalPages) regCidadePage = totalPages;
  var ini = (regCidadePage-1)*REG_CIDADE_SIZE;
  sorted = sorted.slice(ini, ini+REG_CIDADE_SIZE);

  var info = document.getElementById('regCidadePagInfo');
  var num  = document.getElementById('regCidadePagNum');
  var prev = document.getElementById('regCidadeBtnPrev');
  var next = document.getElementById('regCidadeBtnNext');
  if (info) info.textContent = 'Mostrando '+(ini+1)+'–'+Math.min(ini+REG_CIDADE_SIZE,total)+' de '+total+' cidades';
  var sub = document.getElementById('regCidadeSubtitle');
  if (sub) sub.textContent = regEstadoSelecionado ? '— ' + regEstadoSelecionado : '';
  if (num)  num.textContent  = 'Página '+regCidadePage+' de '+totalPages;
  if (prev) { prev.disabled=regCidadePage===1; prev.style.opacity=regCidadePage===1?'0.4':'1'; }
  if (next) { next.disabled=regCidadePage===totalPages; next.style.opacity=regCidadePage===totalPages?'0.4':'1'; }

  var tbody = document.getElementById('regCidadesTbody');
  if (!tbody) return;
  tbody.innerHTML = sorted.map(function(c) {
    var dRec = c.recAnt > 0 ? ((c.receita-c.recAnt)/c.recAnt*100) : 0;
    var dTx  = c.txAnt  > 0 ? ((c.txConv -c.txAnt) /c.txAnt *100) : 0;
    var dPed = c.pedAnt > 0 ? ((c.pedidos-c.pedAnt)/c.pedAnt*100) : 0;
    var dSes = c.sesAnt > 0 ? ((c.sessoes-c.sesAnt)/c.sesAnt*100) : 0;
    var dRoas= c.roasAnt> 0 ? ((c.roas   -c.roasAnt)/c.roasAnt*100) : 0;
    function d(v,up){ return '<span style="font-size:10px;margin-left:3px;color:'+(up?'#0ca30c':'#d03b3b')+'">'+(up?'▲':'▼')+' '+Math.abs(v).toFixed(1)+'%</span>'; }

      '<td class="reg-td">' + c.txConv.toFixed(2) + '%' + d(dTx, dTx>=0) + '</td>' +
      '<td class="reg-td">' + c.pedidos + d(dPed, dPed>=0) + '</td>' +

window.regSelecionarEstado = function(uf) {
  regEstadoSelecionado = regEstadoSelecionado === uf ? null : uf;
  regCidadePage = 1;
  var bc = document.getElementById('regBreadcrumb');
  var bt = document.getElementById('regBreadcrumbText');
  if (bc && bt) {
    if (regEstadoSelecionado) {
      var est = (typeof ESTADOS_DATA !== 'undefined') ? ESTADOS_DATA.find(function(e){ return e.uf===regEstadoSelecionado; }) : null;
      bc.style.display = 'flex';
      bt.textContent = 'Filtrando cidades por: ' + (est ? est.nome : regEstadoSelecionado);
    } else {
      bc.style.display = 'none';
    }
  }
  renderRegTabela();
  renderRegCidades();
};

window.regLimparFiltro = function() {
  regEstadoSelecionado = null;
  regCidadePage = 1;
  var bc = document.getElementById('regBreadcrumb');
  if (bc) bc.style.display = 'none';
  renderRegTabela();
  renderRegCidades();
};

window.regEstadoPrev = function() { if(regEstadoPage>1){regEstadoPage--;renderRegTabela();} };
window.regEstadoNext = function() { regEstadoPage++; renderRegTabela(); };
window.regCidadePrev = function() { if(regCidadePage>1){regCidadePage--;renderRegCidades();} };
window.regCidadeNext = function() { regCidadePage++; renderRegCidades(); };

window.setRegPeriod = function(days, btn) {
  document.querySelectorAll('.reg-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (days > 0) {
    var fim = new Date(), ini = new Date();
    ini.setDate(ini.getDate() - days);
    var fmt2 = function(d){ return d.toISOString().slice(0,10); };
    var lbl = document.getElementById('regRangeLabel');
    if (lbl) lbl.textContent = fmt2(ini) + ' \u2192 ' + fmt2(fim);
  }
};

})();
</script>

<script>
(function(){

var SIM = {
  verbaMensal: 6000,
  cps: 0.60,
  ticketMedio: 150,
  txConv: 1.10
};

function calcSim() {
  var visitasMensais = SIM.cps > 0 ? SIM.verbaMensal / SIM.cps : 0;
  var pedidosMes      = visitasMensais * (SIM.txConv / 100);
  var cpa              = pedidosMes > 0 ? SIM.verbaMensal / pedidosMes : 0;
  var faturamentoBruto = pedidosMes * SIM.ticketMedio;
  var roasBruto         = SIM.verbaMensal > 0 ? faturamentoBruto / SIM.verbaMensal : 0;

  return {
    visitasMensais: visitasMensais,
    pedidosMes: pedidosMes,
    cpa: cpa,
    faturamentoBruto: faturamentoBruto,
    roasBruto: roasBruto,
    investDiario: SIM.verbaMensal / 30,
    visitasDiarias: visitasMensais / 30,
    pedidosDiarios: pedidosMes / 30,
    faturamentoDiario: faturamentoBruto / 30
  };
}

function fmtBR(v, dec) {
  return v.toLocaleString('pt-BR', {minimumFractionDigits: dec||2, maximumFractionDigits: dec||2});
}

window.renderSimulacao = function() {
  var el = document.getElementById('aba-simulacao');
  if (el.innerHTML.trim()) { updateSimDisplay(); return; }

  var st = document.createElement('style');
  st.textContent =
    '.sim-wrap{max-width:760px;margin:0 auto;}' +
    '.sim-section{border:1px solid #d0d5e0;border-radius:8px;overflow:hidden;margin-bottom:14px;}' +
    '.sim-header{background:#1a1a2e;color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:600;letter-spacing:.04em;}' +
    '.sim-row{display:grid;grid-template-columns:1fr 140px;align-items:center;border-bottom:1px solid #eceef3;}' +
    '.sim-row-calc{display:grid;grid-template-columns:1fr 140px 220px;align-items:center;border-bottom:1px solid #eceef3;}' +
    '.sim-row:last-child,.sim-row-calc:last-child{border-bottom:none;}' +
    '.sim-label{padding:10px 16px;font-size:13px;color:#2a2e45;background:#fafbff;}' +
    '.sim-label-edit{background:#e6f1fb;color:#0c447c;font-weight:500;}' +
    '.sim-val{padding:10px 16px;text-align:right;font-size:13px;color:#2a2e45;font-weight:500;}' +
    '.sim-formula{padding:10px 14px;text-align:left;font-size:11px;color:#9aa3bf;background:#f7f8fc;border-left:1px solid #eceef3;font-style:italic;}' +
    '.sim-input-wrap{display:flex;align-items:center;justify-content:flex-end;padding:6px 12px;gap:4px;}' +
    '.sim-prefix{font-size:13px;color:#0c447c;font-weight:500;}' +
    '.sim-input{width:90px;text-align:right;border:1px solid #b5d4f4;border-radius:6px;padding:5px 8px;font-size:13px;color:#0c447c;font-weight:600;background:#fff;}' +
    '.sim-input:focus{outline:none;border-color:#185fa5;box-shadow:0 0 0 2px rgba(24,95,165,0.15);}';
  document.head.appendChild(st);

  function simRowCalc(label, valId, formula, bgStyle) {
    var lblStyle = bgStyle ? ' style="' + bgStyle + '"' : '';
    var valStyle = bgStyle ? ' style="' + bgStyle.replace('background:#eaf3de;','') + 'font-weight:700;"' : '';
    return '<div class="sim-row-calc">' +
      '<div class="sim-label"' + lblStyle + '>' + label + '</div>' +
      '<div class="sim-val" id="' + valId + '"' + valStyle + '>—</div>' +
      '<div class="sim-formula">' + formula + '</div>' +
    '</div>';
  }

  el.innerHTML =
    '<div class="sim-wrap">' +

    '<div class="sim-section">' +
      '<div class="sim-header">Planejamento de orçamento × faturamento</div>' +
      '<div class="sim-row"><div class="sim-label sim-label-edit">Verba mensal</div>' +
        '<div class="sim-input-wrap"><span class="sim-prefix">R$</span><input type="number" id="simVerba" class="sim-input" value="' + SIM.verbaMensal + '" step="100" oninput="simUpdate(\'verbaMensal\',this.value)"></div></div>' +
    '</div>' +

    '<div class="sim-section">' +
      '<div class="sim-row"><div class="sim-label sim-label-edit">CPS (custo por sessão)</div>' +
        '<div class="sim-input-wrap"><span class="sim-prefix">R$</span><input type="number" id="simCps" class="sim-input" value="' + SIM.cps + '" step="0.01" oninput="simUpdate(\'cps\',this.value)"></div></div>' +
      '<div class="sim-row"><div class="sim-label sim-label-edit">Ticket médio</div>' +
        '<div class="sim-input-wrap"><span class="sim-prefix">R$</span><input type="number" id="simTicket" class="sim-input" value="' + SIM.ticketMedio + '" step="1" oninput="simUpdate(\'ticketMedio\',this.value)"></div></div>' +
      '<div class="sim-row"><div class="sim-label sim-label-edit">Taxa de conversão</div>' +
        '<div class="sim-input-wrap"><input type="number" id="simTx" class="sim-input" value="' + SIM.txConv + '" step="0.01" oninput="simUpdate(\'txConv\',this.value)"><span class="sim-prefix">%</span></div></div>' +
    '</div>' +

    '<div class="sim-section">' +
      simRowCalc('Visitas mensais', 'simVisitas', 'Verba mensal ÷ CPS') +
      simRowCalc('CPA', 'simCpa', 'Verba mensal ÷ Pedidos/mês') +
      simRowCalc('Pedidos / mês', 'simPedidos', 'Visitas mensais × Taxa de conversão') +
    '</div>' +

    '<div class="sim-section">' +
      simRowCalc('Faturamento bruto', 'simFaturamento', 'Pedidos/mês × Ticket médio', 'background:#eaf3de;color:#3b6d11;font-weight:500;') +
      simRowCalc('ROAS bruto', 'simRoas', 'Faturamento bruto ÷ Verba mensal', 'background:#eaf3de;color:#3b6d11;font-weight:500;') +
    '</div>' +

    '<div class="sim-section">' +
      '<div class="sim-header">Diário</div>' +
      simRowCalc('Investimento diário', 'simInvDiario', 'Verba mensal ÷ 30') +
      simRowCalc('Visitas diárias', 'simVisitasDiario', 'Visitas mensais ÷ 30') +
      simRowCalc('Pedidos diários', 'simPedidosDiario', 'Pedidos/mês ÷ 30') +
      simRowCalc('Faturamento diário', 'simFatDiario', 'Faturamento bruto ÷ 30', 'background:#eaf3de;color:#3b6d11;font-weight:500;') +
    '</div>' +

    '</div>';

  updateSimDisplay();
};

function updateSimDisplay() {
  var c = calcSim();
  function set(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }

  set('simVisitas', fmtBR(c.visitasMensais, 0));
  set('simCpa', 'R$ ' + fmtBR(c.cpa));
  set('simPedidos', fmtBR(c.pedidosMes, 0));
  set('simFaturamento', 'R$ ' + fmtBR(c.faturamentoBruto));
  set('simRoas', fmtBR(c.roasBruto) + 'x');
  set('simInvDiario', 'R$ ' + fmtBR(c.investDiario));
  set('simVisitasDiario', fmtBR(c.visitasDiarias, 0));
  set('simPedidosDiario', fmtBR(c.pedidosDiarios, 0));
  set('simFatDiario', 'R$ ' + fmtBR(c.faturamentoDiario));
}

window.simUpdate = function(campo, valor) {
  SIM[campo] = parseFloat(valor) || 0;
  updateSimDisplay();
};

})();
</script>
<!-- ABA META X REALIZADO -->
<div id="aba-metarealizado" style="display:none;"></div>

<script>
(function(){

var MR_MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MR_LABEL = {jan:'Janeiro',fev:'Fevereiro',mar:'Março',abr:'Abril',mai:'Maio',jun:'Junho',jul:'Julho',ago:'Agosto',set:'Setembro',out:'Outubro',nov:'Novembro',dez:'Dezembro'};
var MR_ANOS = ['2026', '2027'];
var mrAnoAtual = '2026';

var MR_PROJ = {};
var MR_GA4 = {};
var MR_PLAT = {};

MR_ANOS.forEach(function(ano) {
  MR_PROJ[ano] = {};
  MR_GA4[ano] = {};
  MR_PLAT[ano] = {};
  MR_MESES.forEach(function(m){
    MR_PROJ[ano][m] = { cpsMidia: 0.60, sessoes: 16500, transacoes: 204, investMeta: 4014.78, investGoogle: 1992.54, receita: 32571 };
    MR_GA4[ano][m]  = { receita: 0, investMeta: 0, investGoogle: 0, sessoes: 0, transacoes: 0, cpsMidia: 0 };
    MR_PLAT[ano][m] = { receita: 0, ticketMedio: 0, transacoes: 0 };
  });
});

var mrExpanded = {};

function calcProj(m) {
  var p = MR_PROJ[mrAnoAtual][m];
  var investTotal = p.investMeta + p.investGoogle;
  var pctMeta = investTotal > 0 ? p.investMeta / investTotal * 100 : 0;
  var pctGoogle = investTotal > 0 ? p.investGoogle / investTotal * 100 : 0;
  var cpsGeral = p.sessoes > 0 ? investTotal / p.sessoes : 0;
  var txConv = p.sessoes > 0 ? p.transacoes / p.sessoes * 100 : 0;
  var ticketMedio = p.transacoes > 0 ? p.receita / p.transacoes : 0;
  var roas = investTotal > 0 ? p.receita / investTotal : 0;
  return {
    receita: p.receita, investTotal: investTotal, investMeta: p.investMeta, investGoogle: p.investGoogle,
    pctMeta: pctMeta, pctGoogle: pctGoogle, sessoes: p.sessoes, cpsGeral: cpsGeral, cpsMidia: p.cpsMidia,
    txConv: txConv, transacoes: p.transacoes, ticketMedio: ticketMedio, roas: roas
  };
}

function calcGA4(m) {
  var g = MR_GA4[mrAnoAtual][m];
  var investTotal = g.investMeta + g.investGoogle;
  var pctMeta = investTotal > 0 ? g.investMeta / investTotal * 100 : 0;
  var pctGoogle = investTotal > 0 ? g.investGoogle / investTotal * 100 : 0;
  var cpsGeral = g.sessoes > 0 ? investTotal / g.sessoes : 0;
  var txConv = g.sessoes > 0 ? g.transacoes / g.sessoes * 100 : 0;
  var ticketMedio = g.transacoes > 0 ? g.receita / g.transacoes : 0;
  var roas = investTotal > 0 ? g.receita / investTotal : 0;
  return {
    receita: g.receita, investTotal: investTotal, investMeta: g.investMeta, investGoogle: g.investGoogle,
    pctMeta: pctMeta, pctGoogle: pctGoogle, sessoes: g.sessoes, cpsGeral: cpsGeral, cpsMidia: g.cpsMidia,
    txConv: txConv, transacoes: g.transacoes, ticketMedio: ticketMedio, roas: roas
  };
}

function calcPlat(m) {
  var ga4 = calcGA4(m);
  var p = MR_PLAT[mrAnoAtual][m];
  // Receita e Transações são editáveis na Plataforma — o resto usa base do GA4
  var receita = p.receita;
  var transacoes = p.transacoes;
  var sessoes = ga4.sessoes;                          // copiado do GA4
  var investTotal = ga4.investTotal;                  // copiado do GA4
  var investMeta = ga4.investMeta;
  var investGoogle = ga4.investGoogle;
  var pctMeta = ga4.pctMeta;
  var pctGoogle = ga4.pctGoogle;
  var cpsGeral = ga4.cpsGeral;                         // copiado do GA4 (Invest. GA4 ÷ Sessões GA4)
  var txConv = sessoes > 0 ? transacoes / sessoes * 100 : 0;       // Transações Plat ÷ Sessões GA4
  var ticketMedio = transacoes > 0 ? receita / transacoes : 0;     // Receita Plat ÷ Transações Plat
  var roas = investTotal > 0 ? receita / investTotal : 0;          // Receita Plat ÷ Invest. GA4
  return {
    receita: receita, investTotal: investTotal, investMeta: investMeta, investGoogle: investGoogle,
    pctMeta: pctMeta, pctGoogle: pctGoogle, sessoes: sessoes, cpsGeral: cpsGeral, cpsMidia: ga4.cpsMidia,
    txConv: txConv, transacoes: transacoes, ticketMedio: ticketMedio, roas: roas
  };
}

function pctFalta(proj, real) {
  if (!proj) return null;
  return ((proj - real) / proj * 100);
}

function fmtMoeda(v) { return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtPct(v) { return v.toFixed(2) + '%'; }
function fmtX(v) { return v.toFixed(2) + 'x'; }
function fmtNum(v) { return Math.round(v).toLocaleString('pt-BR'); }

var ROWS_MR = [
  {key:'receita', label:'Receita captada', type:'moeda', editProj:true, editPlat:true, hl:true},
  {key:'investTotal', label:'Investimento total', type:'moeda', editProj:false},
  {key:'investMeta', label:'Investimento Meta Ads', type:'moeda', editProj:true, onlyProj:true},
  {key:'investGoogle', label:'Investimento Google Ads', type:'moeda', editProj:true, onlyProj:true},
  {key:'pctMeta', label:'% Investimento Meta Ads', type:'pct', editProj:false, onlyProj:true},
  {key:'pctGoogle', label:'% Investimento Google Ads', type:'pct', editProj:false, onlyProj:true},
  {key:'sessoes', label:'Sessões', type:'num', editProj:true},
  {key:'cpsGeral', label:'CPS (Geral)', type:'moeda', editProj:false},
  {key:'cpsMidia', label:'CPS (Mídia)', type:'moeda', editProj:true, onlyProj:true},
  {key:'txConv', label:'Taxa de conversão', type:'pct', editProj:false},
  {key:'transacoes', label:'Transações', type:'num', editProj:true, editPlat:true},
  {key:'ticketMedio', label:'Ticket médio', type:'moeda', editProj:false},
  {key:'roas', label:'ROAS captado', type:'moeda_x', editProj:false},
];

function fmtVal(v, type) {
  if (type === 'moeda') return fmtMoeda(v);
  if (type === 'pct') return fmtPct(v);
  if (type === 'num') return fmtNum(v);
  if (type === 'moeda_x') return fmtX(v);
  return v;
}

window.renderMetaRealizado = function() {
  var el = document.getElementById('aba-metarealizado');
  if (el.innerHTML.trim()) { mrRenderTable(); return; }

  var st = document.createElement('style');
  st.textContent =
    '.mr-th{padding:6px 10px;background:#1a1a2e;color:#e8eaf0;font-size:11px;font-weight:500;text-align:center;white-space:nowrap;border-bottom:1px solid #2d3352;}' +
    '.mr-th-metric{text-align:left;position:sticky;left:0;z-index:5;background:#1a1a2e;min-width:190px;}' +
    '.mr-th-mes{cursor:pointer;background:#252a42;}' +
    '.mr-th-mes:hover{background:#2d3352;}' +
    '.mr-td{padding:5px 10px;border-bottom:1px solid #eceef3;text-align:right;font-size:12px;color:#2a2e45;white-space:nowrap;}' +
    '.mr-td-metric{text-align:left;position:sticky;left:0;z-index:2;background:#fff;color:#185fa5;font-weight:500;min-width:190px;border-right:1px solid #eceef3;}' +
    '.mr-td-proj{background:#fff;}' +
    '.mr-td-real{background:#e8f5e9;}' +
    '.mr-td-plat{background:#e3f2fd;}' +
    '.mr-input{width:80px;text-align:right;border:1px solid #d0d5e0;border-radius:4px;padding:3px 6px;font-size:11px;color:#1a1a2e;font-weight:600;background:#fff;}' +
    '.mr-input-plat{border-color:#378add;color:#0c447c;background:#f5f9ff;}' +
    '.mr-input:focus{outline:none;box-shadow:0 0 0 2px rgba(245,197,24,0.3);}' +
    '.mr-hl td{background:#fafbff;}' +
    '.mr-hl td.mr-td-metric{font-weight:600;color:#1a1a2e;}' +
    '.mr-chevron{font-size:9px;margin-right:5px;display:inline-block;transition:transform .15s;}' +
    '.mr-expanded .mr-chevron{transform:rotate(90deg);}' +
    '.mr-sub-hidden{display:none;}' +
    '.mr-legend-box{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-1px;}';
  document.head.appendChild(st);

  var anoSelectorHtml = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">' +
    '<span style="font-size:10px;font-weight:700;color:#6b7591;letter-spacing:.08em;text-transform:uppercase;">Ano</span>' +
    '<div style="display:flex;gap:4px;" id="mrAnoBtns"></div>' +
    '</div>';

  var legendHtml = '<div style="display:flex;gap:18px;margin-bottom:12px;font-size:12px;color:#6b7591;align-items:center;">' +
    '<span><span class="mr-legend-box" style="background:#f5c518;"></span>Projeção (editável)</span>' +
    '<span><span class="mr-legend-box" style="background:#5dc870;"></span>Realizado — GA4 (automático)</span>' +
    '<span><span class="mr-legend-box" style="background:#378add;"></span>Plataforma (editável)</span>' +
    '<span style="margin-left:auto;">▶ clique no mês para expandir</span>' +
    '</div>';

  el.innerHTML = anoSelectorHtml + legendHtml +
    '<div style="background:#fff;border:1px solid #d0d5e0;border-radius:8px;overflow:hidden;">' +
    '<div style="overflow-x:auto;max-height:calc(100vh - 280px);overflow-y:auto;">' +
    '<table style="border-collapse:collapse;width:max-content;min-width:100%;" id="mrTable">' +
    '<thead id="mrThead"></thead>' +
    '<tbody id="mrTbody"></tbody>' +
    '</table></div></div>';

  mrRenderAnoBtns();
  mrRenderTable();
};

function mrRenderAnoBtns() {
  var wrap = document.getElementById('mrAnoBtns');
  if (!wrap) return;
  wrap.innerHTML = MR_ANOS.map(function(ano) {
    var active = ano === mrAnoAtual;
    return '<button onclick="mrSelecionarAno(\'' + ano + '\')" style="background:' + (active?'#1a1a2e':'#fff') + ';color:' + (active?'#fff':'#6b7591') + ';border:1px solid ' + (active?'#1a1a2e':'#d0d5e0') + ';padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;">' + ano + '</button>';
  }).join('');
}

window.mrSelecionarAno = function(ano) {
  mrAnoAtual = ano;
  mrRenderAnoBtns();
  mrRenderTable();
};

function mrToggle(m) {
  mrExpanded[m] = !mrExpanded[m];
  mrRenderTable();
}
window.mrToggle = mrToggle;

function mrRenderTable() {
  var thead = document.getElementById('mrThead');
  var tbody = document.getElementById('mrTbody');
  if (!thead || !tbody) return;

  // Cabeçalho: Métrica | [Mês expandido: Proj|Real|Plat] ou [Mês colapsado: Proj]
  var thHtml = '<tr><th class="mr-th mr-th-metric">Métrica</th>';
  MR_MESES.forEach(function(m) {
    var exp = mrExpanded[m];
    thHtml += '<th class="mr-th mr-th-mes" colspan="' + (exp?5:1) + '" onclick="mrToggle(\'' + m + '\')">' +
      '<span class="mr-chevron' + (exp?' mr-expanded-icon':'') + '" style="' + (exp?'transform:rotate(90deg);':'') + '">▶</span>' + MR_LABEL[m] + '</th>';
  });
  thHtml += '</tr><tr><th class="mr-th mr-th-metric" style="background:#1a1a2e;"></th>';
  MR_MESES.forEach(function(m) {
    if (mrExpanded[m]) {
      thHtml += '<th class="mr-th" style="background:#5f5e5a;font-size:10px;">Projeção</th>' +
                '<th class="mr-th" style="background:#1e5631;font-size:10px;">Realizado</th>' +
                '<th class="mr-th" style="background:#1e5631;font-size:9px;opacity:0.85;">% Δ</th>' +
                '<th class="mr-th" style="background:#0c447c;font-size:10px;">Plataforma</th>' +
                '<th class="mr-th" style="background:#0c447c;font-size:9px;opacity:0.85;">% Δ</th>';
    } else {
      thHtml += '<th class="mr-th" style="background:#5f5e5a;font-size:10px;">Projeção</th>';
    }
  });
  thHtml += '</tr>';
  thead.innerHTML = thHtml;

  // Corpo
  var rowsHtml = '';
  ROWS_MR.forEach(function(row) {
    rowsHtml += '<tr class="' + (row.hl?'mr-hl':'') + '">';
    rowsHtml += '<td class="mr-td mr-td-metric">' + row.label + '</td>';

    MR_MESES.forEach(function(m) {
      var proj = calcProj(m);
      var ga4  = calcGA4(m);
      var plat = MR_PLAT[mrAnoAtual][m];
      var platCalc = calcPlat(m);

      // Projeção
      var valProj = proj[row.key];
      var cellProj;
      if (row.editProj) {
        cellProj = '<input type="text" inputmode="decimal" class="mr-input" value="' + valProj.toFixed(row.type==='moeda'||row.type==='moeda_x'?2:0).replace('.',',') + '" oninput="mrUpdateProj(\'' + m + '\',\'' + row.key + '\',this.value)">';
      } else {
        cellProj = fmtVal(valProj, row.type);
      }
      rowsHtml += '<td class="mr-td mr-td-proj">' + cellProj + '</td>';

      if (mrExpanded[m]) {
        // Realizado GA4
        var valReal = ga4[row.key];
        var cellReal = fmtVal(valReal, row.type);
        rowsHtml += '<td class="mr-td mr-td-real">' + cellReal + '</td>';

        // % Δ Realizado vs Projeção
        var faltaPct = (row.key === 'receita' || row.key === 'transacoes' || row.key === 'sessoes' || row.key === 'investTotal') ? pctFalta(valProj, valReal) : null;
        var faltaHtml = faltaPct !== null ?
          '<span style="color:' + (faltaPct>0?'#d03b3b':'#0ca30c') + ';font-weight:500;">' + (faltaPct>0?'▼ ':'▲ ') + Math.abs(faltaPct).toFixed(1) + '%</span>' : '—';
        rowsHtml += '<td class="mr-td mr-td-real" style="font-size:10px;">' + faltaHtml + '</td>';

        // Plataforma — só Receita e Transações são editáveis; o resto é calculado (calcPlat)
        if (!row.onlyProj) {
          var cellPlat;
          var isEditavelPlat = (row.key === 'receita' || row.key === 'transacoes');
          if (isEditavelPlat) {
            var rawVal = plat[row.key] || 0;
            cellPlat = '<input type="text" inputmode="decimal" class="mr-input mr-input-plat" value="' + rawVal.toFixed(row.type==='moeda'||row.type==='moeda_x'?2:0).replace('.',',') + '" oninput="mrUpdatePlat(\'' + m + '\',\'' + row.key + '\',this.value)">';
          } else {
            cellPlat = fmtVal(platCalc[row.key], row.type);
          }
          rowsHtml += '<td class="mr-td mr-td-plat">' + cellPlat + '</td>';

          // % Δ Plataforma vs Projeção — calculado sobre o valor real (editável ou derivado)
          var platValReal = platCalc[row.key];
          var faltaPlatPct = (row.key === 'receita' || row.key === 'transacoes' || row.key === 'sessoes' || row.key === 'investTotal') ? pctFalta(valProj, platValReal) : null;
          var faltaPlatHtml = faltaPlatPct !== null ?
            '<span style="color:' + (faltaPlatPct>0?'#d03b3b':'#0ca30c') + ';font-weight:500;">' + (faltaPlatPct>0?'▼ ':'▲ ') + Math.abs(faltaPlatPct).toFixed(1) + '%</span>' : '—';
          rowsHtml += '<td class="mr-td mr-td-plat" style="font-size:10px;">' + faltaPlatHtml + '</td>';
        } else {
          rowsHtml += '<td class="mr-td mr-td-plat" style="color:#bbb;">—</td>';
          rowsHtml += '<td class="mr-td mr-td-plat" style="color:#bbb;font-size:10px;">—</td>';
        }
      }
    });

    rowsHtml += '</tr>';
  });

  tbody.innerHTML = rowsHtml;
}

function mrParseNum(val) {
  var clean = String(val).replace(/[^\d.,\-]/g, '').replace(',', '.');
  return parseFloat(clean) || 0;
}

window.mrUpdateProj = function(m, key, val) {
  MR_PROJ[mrAnoAtual][m][key] = mrParseNum(val);
  mrRenderTablePreserveFocus();
};

window.mrUpdatePlat = function(m, key, val) {
  MR_PLAT[mrAnoAtual][m][key] = mrParseNum(val);
  mrRenderTablePreserveFocus();
};

function mrRenderTablePreserveFocus() {
  var active = document.activeElement;
  var isInput = active && active.tagName === 'INPUT' && active.closest('#mrTable');
  if (!isInput) { mrRenderTable(); return; }

  var allInputs = Array.prototype.slice.call(document.querySelectorAll('#mrTable input'));
  var activeIndex = allInputs.indexOf(active);
  // Guarda a distância do cursor até o FINAL do texto (estável mesmo se o valor formatado mudar de tamanho)
  var oldLen = active.value.length;
  var distFromEnd = oldLen - active.selectionStart;

  mrRenderTable();

  var newInputs = document.querySelectorAll('#mrTable input');
  if (newInputs[activeIndex]) {
    var el = newInputs[activeIndex];
    el.focus();
    var newLen = el.value.length;
    var newPos = Math.max(0, newLen - distFromEnd);
    try { el.setSelectionRange(newPos, newPos); } catch(e) {}
  }
}

})();
</script>
